name: Build Windows Portable EXE

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the EXE to a GitHub Release
        type: boolean
        default: false
      release_tag:
        description: Release tag used when publishing
        type: string
        default: v1.1.0

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Prepare short build path and bundled Node.js
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "outputs/chroma-cross-platform-package/win"
          New-Item -ItemType Directory -Force "C:\chroma\win" | Out-Null
          Copy-Item -Path "$source\*" -Destination "C:\chroma\win" -Recurse -Force
          New-Item -ItemType Directory -Force "C:\chroma\win\node-windows" | Out-Null
          Copy-Item -Path (Get-Command node).Source -Destination "C:\chroma\win\node-windows\node.exe" -Force

      - name: Install dependencies
        working-directory: C:\chroma\win\electron-client
        run: pnpm install --frozen-lockfile

      - name: Build portable EXE
        working-directory: C:\chroma\win\electron-client
        run: pnpm run build:win

      - name: Collect portable EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts" | Out-Null
          Copy-Item -Path "C:\chroma\win\electron-client\dist\*.exe" -Destination "$env:GITHUB_WORKSPACE\artifacts" -Force

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: chroma-cross-windows-x64-portable-v1.1.0
          path: artifacts/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\artifacts\*.exe" | Select-Object -First 1
          $notes = @"
          Windows x64 portable client for Chroma Cross v1.1.0.

          Includes the local control server and a bundled Node.js runtime. No Node.js installation is required.
          "@
          gh release create $env:RELEASE_TAG $exe.FullName --target $env:GITHUB_SHA --title "Chroma Cross v1.1.0" --notes $notes

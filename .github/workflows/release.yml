name: Build MarkerDeck release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: "1.7.0"
      publish_release:
        description: Upload packages to a GitHub Release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - id: release
        name: Resolve release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish_release }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
            publish="true"
          else
            version="$INPUT_VERSION"
            tag="v$INPUT_VERSION"
            publish="$INPUT_PUBLISH"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Install Node runtime dependencies
        run: npm ci --omit=dev

      - name: Prepare Node.js arm64 runtime
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/node-arm64.tar.gz" \
            "https://nodejs.org/dist/v24.14.0/node-v24.14.0-darwin-arm64.tar.gz"
          tar -xzf "$RUNNER_TEMP/node-arm64.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p runtime/macos/node-macos
          cp "$RUNNER_TEMP/node-v24.14.0-darwin-arm64/bin/node" runtime/macos/node-macos/node
          chmod +x runtime/macos/node-macos/node

      - name: Package macOS arm64
        run: ./scripts/package-macos.sh "${{ needs.prepare.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: markerdeck-macos-arm64-${{ needs.prepare.outputs.version }}
          path: artifacts/markerdeck-macos-arm64-v${{ needs.prepare.outputs.version }}.zip
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node runtime dependencies
        run: npm ci --omit=dev

      - name: Prepare Windows runtimes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force "runtime\windows\node-windows" | Out-Null
          Copy-Item -Path (Get-Command node).Source -Destination "runtime\windows\node-windows\node.exe" -Force
          .\platform\windows\prepare-ffmpeg.ps1

      - name: Package Windows ZIP
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Version "${{ needs.prepare.outputs.version }}"

      - name: Install desktop dependencies
        working-directory: desktop/electron
        run: pnpm install --frozen-lockfile

      - name: Set desktop package version
        working-directory: desktop/electron
        shell: pwsh
        run: |
          $package = Get-Content "package.json" -Raw | ConvertFrom-Json
          $package.version = "${{ needs.prepare.outputs.version }}"
          $package | ConvertTo-Json -Depth 20 | Set-Content "package.json" -Encoding utf8

      - name: Build desktop client ZIP
        working-directory: desktop/electron
        run: pnpm exec electron-builder --win zip --x64

      - name: Verify desktop client ZIP
        shell: pwsh
        run: |
          $archive = Get-ChildItem "desktop/electron/dist/MarkerDeck.Client.*.zip" | Select-Object -First 1
          if (-not $archive) {
            throw "Desktop client ZIP was not created."
          }

          $verifyRoot = Join-Path $env:RUNNER_TEMP "markerdeck-desktop-verify"
          Expand-Archive -Path $archive.FullName -DestinationPath $verifyRoot -Force

          $requiredFiles = @(
            "MarkerDeck.exe",
            "ffmpeg.dll",
            "resources/server/node-windows/node.exe",
            "resources/server/ffmpeg-windows/ffmpeg.exe",
            "resources/server/node_modules/bonjour-service/package.json",
            "resources/server/node_modules/multicast-dns/index.js"
          )
          foreach ($relativePath in $requiredFiles) {
            $fullPath = Join-Path $verifyRoot $relativePath
            if (-not (Test-Path $fullPath -PathType Leaf)) {
              throw "Desktop client ZIP is missing: $relativePath"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: markerdeck-windows-x64-${{ needs.prepare.outputs.version }}
          path: |
            artifacts/markerdeck-windows-x64-v${{ needs.prepare.outputs.version }}.zip
            desktop/electron/dist/MarkerDeck.Client.*.zip
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36.1" "build-tools;36.1.0"

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Prepare Android release asset
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/markerdeck-android-debug-v${{ needs.prepare.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: markerdeck-android-debug-${{ needs.prepare.outputs.version }}
          path: artifacts/markerdeck-android-debug-v${{ needs.prepare.outputs.version }}.apk
          if-no-files-found: error

  release:
    needs: [prepare, macos, windows, android]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "MarkerDeck v$RELEASE_VERSION" \
              --generate-notes
          fi
          while IFS= read -r -d '' asset; do
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          done < <(find artifacts -type f \( -name "*.zip" -o -name "*.apk" \) -print0)
